[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-codex-voice-development"
version = "0.1.0"
description = "Development tooling for the Codex Voice Home Assistant integration"
requires-python = ">=3.14.2"
dependencies = []

[project.optional-dependencies]
test = [
  "homeassistant==2026.8.0",
  "pytest>=8.4",
  "pytest-aiohttp>=1.1",
  "pytest-asyncio>=1.2",
  "pytest-cov>=7.0",
  "pytest-homeassistant-custom-component>=0.13.300",
]
lint = [
  "mypy>=1.17",
  "ruff>=0.12",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires a local Codex login and network access",
]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [".git"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "D203",
  "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
