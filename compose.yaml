name: ha-codex-voice

services:
  bridge:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        CODEX_CLI_VERSION: "${CODEX_CLI_VERSION:-0.147.0}"
    image: "ha-codex-voice-bridge:${HA_CODEX_IMAGE_TAG:-0.147.0}"
    init: true
    user: "${HA_CODEX_UID:-1000}:${HA_CODEX_GID:-1000}"
    read_only: true
    restart: unless-stopped
    network_mode: host
    env_file:
      - "${HA_CODEX_ENV_FILE:-./.codex-voice/bridge.env}"
    environment:
      CODEX_APP_SERVER_COMMAND: ""
      HOME: /tmp
      HA_CODEX_AUTH_FILE: /run/codex-auth/auth.json
      HA_CODEX_BINARY: /usr/local/bin/codex
      HA_CODEX_BRIDGE_CWD: ""
      HA_CODEX_BRIDGE_HOST: "${HA_CODEX_BRIDGE_HOST:-0.0.0.0}"
      HA_CODEX_BRIDGE_PORT: "${HA_CODEX_BRIDGE_PORT:-8787}"
      HA_CODEX_REALTIME_LOG_TRANSCRIPTS: "${HA_CODEX_REALTIME_LOG_TRANSCRIPTS:-false}"
      HA_CODEX_TRANSCRIBE_LIVE_FRAGMENT_QUIET_SECONDS: "${HA_CODEX_TRANSCRIBE_LIVE_FRAGMENT_QUIET_SECONDS:-0.5}"
      HA_CODEX_WEB_SEARCH_TIMEOUT: "${HA_CODEX_WEB_SEARCH_TIMEOUT:-10}"
      HA_CODEX_WEB_SEARCH_URL: "http://127.0.0.1:${HA_CODEX_SEARCH_PORT:-8888}/search"
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    depends_on:
      search:
        condition: service_healthy
    volumes:
      - type: bind
        source: "${HA_CODEX_AUTH_FILE_HOST:?Set HA_CODEX_AUTH_FILE_HOST to the absolute auth.json path}"
        target: /run/codex-auth/auth.json
        read_only: false
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "python3", "/app/deploy/docker/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  search:
    image: "docker.io/searxng/searxng@sha256:c7ca5516d881de86f34ea65fcb4231eb1b2d0837f95abe6cd035764e051eb575"
    init: true
    user: "977:977"
    read_only: true
    restart: unless-stopped
    environment:
      FORCE_OWNERSHIP: "false"
      GRANIAN_HOST: "0.0.0.0"
      SEARXNG_BASE_URL: "http://127.0.0.1:${HA_CODEX_SEARCH_PORT:-8888}/"
      SEARXNG_SECRET: "${HA_CODEX_SEARCH_SECRET:-local-loopback-search-cookie-secret}"
    ports:
      - "127.0.0.1:${HA_CODEX_SEARCH_PORT:-8888}:8080"
    volumes:
      - type: bind
        source: "./deploy/searxng/settings.yml"
        target: /etc/searxng/settings.yml
        read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
      - /var/cache/searxng:rw,nosuid,nodev,noexec,size=64m,mode=0750,uid=977,gid=977
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
