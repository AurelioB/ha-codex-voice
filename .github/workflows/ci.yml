name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Install component test dependencies
        run: uv sync --extra test --extra lint
      - name: Lint and format
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Test Home Assistant component
        run: uv run pytest tests/component --cov=custom_components --cov-report=term-missing
      - name: Test bridge
        run: uv run pytest -p no:homeassistant tests/bridge --cov=bridge --cov-report=term-missing
