name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  integration-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build HACS archive
        run: cd custom_components/codex_voice && zip -r ../../codex_voice.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: codex_voice.zip
