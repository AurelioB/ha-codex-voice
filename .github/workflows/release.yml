name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build HACS archive
        run: |
          git archive --format=zip \
            --output=codex_voice.zip \
            HEAD:custom_components/codex_voice
          zip -j codex_voice.zip LICENSE
      - name: Build ThirdReality realtime archive
        run: |
          mkdir -p release/thirdreality-realtime/latency_sitecustomize
          mkdir -p release/thirdreality-realtime/realtime_client
          mkdir -p release/thirdreality-realtime/webrtc_sidecar
          mkdir -p release/thirdreality-realtime/deploy/init
          mkdir -p release/thirdreality-realtime/deploy/pulse
          install -m 0644 \
            device/thirdreality/latency_sitecustomize/sitecustomize.py \
            release/thirdreality-realtime/latency_sitecustomize/sitecustomize.py
          install -m 0644 device/thirdreality/realtime_client/*.py \
            release/thirdreality-realtime/realtime_client/
          install -m 0644 device/thirdreality/webrtc_sidecar/*.py \
            release/thirdreality-realtime/webrtc_sidecar/
          install -m 0644 \
            device/thirdreality/webrtc-runtime.in \
            device/thirdreality/webrtc-runtime.lock.txt \
            device/thirdreality/webrtc-runtime.md \
            release/thirdreality-realtime/
          install -m 0644 scripts/install_thirdreality_webrtc_runtime.py \
            release/thirdreality-realtime/install_thirdreality_webrtc_runtime.py
          install -m 0644 \
            device/thirdreality/codex-realtime.example.json \
            release/thirdreality-realtime/codex-realtime.example.json
          install -m 0644 device/thirdreality/README.md \
            release/thirdreality-realtime/README.md
          install -m 0644 device/thirdreality/deploy/README.md \
            release/thirdreality-realtime/deploy/README.md
          install -m 0755 device/thirdreality/deploy/prepare_mic_gain_boot.py \
            release/thirdreality-realtime/deploy/prepare_mic_gain_boot.py
          install -m 0755 device/thirdreality/deploy/prepare_pulseaudio_aec.py \
            release/thirdreality-realtime/deploy/prepare_pulseaudio_aec.py
          install -m 0755 device/thirdreality/deploy/init/S49codex-mic-gain \
            release/thirdreality-realtime/deploy/init/S49codex-mic-gain
          install -m 0644 \
            device/thirdreality/deploy/pulse/codex-echo-cancel.pa \
            device/thirdreality/deploy/pulse/codex-echo-cancel-speex.pa \
            device/thirdreality/deploy/pulse/codex-echo-cancel-adrian.pa \
            release/thirdreality-realtime/deploy/pulse/
          install -m 0644 LICENSE release/thirdreality-realtime/LICENSE
          cd release/thirdreality-realtime
          zip -r ../../thirdreality-realtime.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            codex_voice.zip
            thirdreality-realtime.zip
